[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "template-dsai"
version = "0.1.0"
description = "Taller de Buenas Prácticas en Ciencia de Datos e IA"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2",
  "numpy>=1.26",
  "matplotlib>=3.8",
  "seaborn>=0.13",
  "scipy>=1.12",
  "scikit-learn>=1.4",
  "pyarrow>=15",         # formato Parquet para Silver y Gold
  "joblib>=1.3",         # guardar el modelo
  "python-dotenv>=1.0",   # leer .env
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.4", "jupyterlab>=4", "nbstripout>=0.7"]

[tool.setuptools.packages.find]
include = ["flows*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
ignore = ["N999", "FURB177"]


